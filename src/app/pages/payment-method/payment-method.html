<div class="container mt-2">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-6">

            <h6 class="mb-3">
                Choose way to pay
            </h6>

            <div class="payment-list">
                @for (method of paymentMethods; track method.id) {
                    <button type="button"
                            class="payment-card"
                            [class.selected]="selectedMethodId === method.id"
                            (click)="selectMethod(method)">

                        <div class="payment-icon">
                            <img [src]="method.icon" [alt]="method.name" />
                        </div>

                        <div class="payment-info">
                            <div class="payment-title">{{ method.name }}</div>

                            @if (method.subtitle) {
                            <div class="payment-subtitle">{{ method.subtitle }}</div>
                            }

                            @if (method.cardBrands?.length) {
                            <div class="card-brands">
                                @for (brand of method.cardBrands; track brand) {
                                <img [src]="'assets/gallery-icon/gallery/payment/' + brand + '.png'" [alt]="brand" />
                                }
                            </div>
                            }
                        </div>

                        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>

                    </button>
                }
                </div>

        </div>
    </div>
</div>

<!-- Bottom Cart Bar -->
<div class="cart-bar-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-6">
                <div class="cart-bar">
                     <div (click)="ContinueWithPayment()" [class.disabled]="!selectedMethodId" class="btn-cart d-flex justify-content-center align-items-center px-3">
                        <!-- <span>{{ loadingPayment ? 'Processing...' : 'Continue to Payment' }}</span> -->
                         <span>Continue to Payment</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
