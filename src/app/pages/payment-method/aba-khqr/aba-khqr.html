<div class="khqr-card">
  <div class="khqr-card__brand">
    <img class="khqr-card__logo" src="../../../../assets/gallery-icon/ABA'Pay.svg" alt="ABA Pay">

    <div class="khqr-ticket">
      <div class="khqr-ticket__banner">
        <span class="khqr-ticket__banner-logo">
          <img src="https://checkout.payway.com.kh/images/khqr-icon.svg" alt="KHQR">
        </span>
        <div class="khqr-ticket-ribbon"></div>
      </div>

      <div class="khqr-ticket__amount-row">
        <span class="khqr-ticket__shop">{{ shopName }}</span>
        <span class="khqr-ticket__amount">
          <span class="khqr-ticket__amount-currency">{{ currencySymbol }}</span>
          @if (currency === 'KHR') {
            {{ allFunction.formatKhr(amount) }}
          } @else {
            {{ amount | number:'1.2-2' }}
          }
        </span>
      </div>

      <div class="khqr-ticket__qr">
        @if (qrDataUrl; as src) {
          <img class="khqr-ticket__qr-img" [src]="src" alt="KHQR payment code">
          <div class="khqr-ticket__qr-logo">
            <img src="../../../../assets/gallery-icon/bakong-logo.png" alt="bakong">
          </div>
        } @else {
          <div class="spinner-border text-secondary"></div>
        }
      </div>
    </div>
  </div>

  <div class="khqr-card__footer">
    Scan with ABA Mobile or any KHQR supported banking app
  </div>
</div>
