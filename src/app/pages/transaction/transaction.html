            <div class="amount-display">
                <h6 class="amount-label">Amount to pay</h6>
                <!-- <div class="amount-divider"></div> -->
                <div class="amount-value-wrap">
                    @if (ABA_payway_data.currency === 'KHR') {
                        <span class="amount-value">{{ allFunctions.formatKhr(ABA_payway_data.amount) }}</span>
                        <span class="amount-currency is-riel">KHR</span>
                    } @else {
                        <span class="amount-value">{{ ABA_payway_data.amount | number:'1.2-2' }}</span>
                        <span class="amount-currency">USD</span>
                    }
                </div>
            </div>

            <h6 class="mb-3">
                Choose way to pay
            </h6>

            <div class="payment-list">
                @for (method of paymentMethods; track method.id) {
                    <button type="button"
                            class="payment-card"
                            [class.selected]="true"
                            (click)="selectMethod(method)">

                        <div class="payment-icon">
                            <img [src]="method.icon" [alt]="method.name" />
                        </div>

                        <div class="payment-info">
                            <div class="payment-title">{{ method.name }}</div>

                            @if (method.subtitle) {
                            <div class="payment-subtitle">{{ method.subtitle }}</div>
                            }

                            <!-- @if (method.cardBrands?.length) {
                            <div class="card-brands">
                                @for (brand of method.cardBrands; track brand) {
                                <img [src]="'assets/gallery-icon/gallery/payment/' + brand + '.png'" [alt]="brand" />
                                }
                            </div>
                            } -->
                        </div>

                        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>

                    </button>
                }
                </div>


                 @if (ABA_payway_data) {
                     <form method="POST" target="aba_webservice" action="https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/purchase" id="aba_merchant_request" >
                        <input type="hidden" name="hash" value="{{ABA_payway_data.hash}}" id="hash">
                        <input type="hidden" name="tran_id" value="{{ABA_payway_data.tran_id}}" id="tran_id" />
                        <input type="hidden" name="amount" value="{{ABA_payway_data.amount}}" />
                        <input type="hidden" name="merchant_id" value="{{ABA_payway_data.merchant_id}}" />
                        <input type="hidden" name="req_time" value="{{ABA_payway_data.req_time}}" />
                        <input type="hidden" name="payment_option" value="{{ABA_payway_data.payment_option}}" id="payment_option" />
                        <input type="hidden" name="firstname" value="{{ABA_payway_data.firstname}}" />
                        <input type="hidden" name="lastname" value="{{ABA_payway_data.lastname}}" />
                        <input type="hidden" name="phone" value="{{ABA_payway_data.phone}}" />
                        <input type="hidden" name="currency" value="{{ABA_payway_data.currency}}" />
                        <input type="hidden" name="email" value="{{ABA_payway_data.email}}" />
                        <input type="hidden" name="return_url" value="{{ABA_payway_data.return_url}}" />
                        <input type="hidden" name="continue_success_url" value="{{ABA_payway_data.continue_success_url}}" />
                        <input type="hidden" name="payment_gate" value="0">
                    </form>
                    
                    
                 }

        </div>
    </div>
</div>

<!-- Bottom Cart Bar -->
<div class="cart-bar-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-6">
                <div class="cart-bar">
                     <button (click)="ContinueWithPayment()" [disabled]="loading" class="btn-cart d-flex justify-content-center align-items-center px-3">
                        <span>{{ loading ? 'Processing...' : 'Continue to Payment' }}</span>
                         <!-- <span>Continue to Payment</span> -->
                    </button>
                    <button style="display: none;" id="checkout_button"></button>
                </div>
            </div>
        </div>
    </div>
</div>
